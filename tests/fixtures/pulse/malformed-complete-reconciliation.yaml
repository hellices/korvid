name: Malformed complete input preserves unknown identities while valid evidence may recover
now: "2026-09-13T12:00:00Z"
scope: production
steps:
  - sources:
      pods:
        objects:
          - metadata: {namespace: production, name: api, uid: api-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "False"}]
              containerStatuses: [{name: api, state: {running: {}}}]
          - metadata: {namespace: production, name: unseen, uid: unseen-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "False"}]
              containerStatuses: [{name: api, state: {running: {}}}]
    expect:
      current_count: 2
      current_names: [api, unseen]
      coverage: {pods: complete}
  - after_seconds: 1
    sources:
      pods:
        objects:
          - metadata: {namespace: production, name: api, uid: api-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: {unexpected: shape}}]
              containerStatuses: [{name: api, state: {running: {}}}]
          - metadata: null
    expect:
      current_count: 2
      current_names: [api, unseen]
      coverage: {pods: partial}
  - after_seconds: 2
    sources:
      pods:
        objects:
          - metadata: {namespace: production, name: api, uid: api-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "True"}]
              containerStatuses: [{name: api, ready: true, state: {running: {}}}]
          - {}
    expect:
      current_count: 1
      current_names: [unseen]
      forbidden_current_names: [api]
      coverage: {pods: partial}
  - after_seconds: 3
    sources:
      pods: {objects: []}
    expect:
      current_count: 0
      coverage: {pods: complete}
