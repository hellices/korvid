name: UID-less healthy observations retain verified evidence until identity is assessable
now: "2026-09-13T12:00:00Z"
scope: production
steps:
  - sources:
      pods:
        objects:
          - metadata: {namespace: production, name: api, uid: api-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "False"}]
              containerStatuses: [{name: api, ready: false, state: {running: {}}}]
    expect:
      current_count: 1
      current_reasons: [NotReady]
      coverage: {pods: complete}
  - after_seconds: 1
    sources:
      pods:
        objects:
          - metadata: {namespace: production, name: api}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "True"}]
              containerStatuses: [{name: api, ready: true, state: {running: {}}}]
    expect:
      current_count: 1
      current_reasons: [NotReady]
      coverage: {pods: partial}
  - after_seconds: 2
    sources:
      pods:
        state: partial
        objects:
          - metadata: {namespace: production, name: api, uid: ""}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "True"}]
              containerStatuses: [{name: api, ready: true, state: {running: {}}}]
    expect:
      current_count: 1
      current_reasons: [NotReady]
      coverage: {pods: partial}
  - after_seconds: 3
    sources:
      pods:
        objects:
          - metadata: {namespace: production, name: api, uid: api-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "True"}]
              containerStatuses: [{name: api, ready: true, state: {running: {}}}]
    expect:
      current_count: 0
      coverage: {pods: complete}
