name: A partial read can confirm recovery only for identities it observed
now: "2026-09-13T12:00:00Z"
scope: production
steps:
  - sources:
      pods:
        objects:
          - metadata: {namespace: production, name: observed, uid: observed-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "False"}]
              containerStatuses: [{name: api, ready: false, state: {running: {}}}]
          - metadata: {namespace: production, name: unseen, uid: unseen-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "False"}]
              containerStatuses: [{name: api, ready: false, state: {running: {}}}]
    expect:
      current_count: 2
      current_reasons: [NotReady]
      coverage: {pods: complete}
  - after_seconds: 1
    sources:
      pods:
        state: partial
        detail: A later page was unavailable
        objects:
          - metadata: {namespace: production, name: observed, uid: observed-uid}
            spec: {containers: [{name: api}]}
            status:
              phase: Running
              conditions: [{type: Ready, status: "True"}]
              containerStatuses: [{name: api, ready: true, state: {running: {}}}]
    expect:
      current_count: 1
      current_names: [unseen]
      forbidden_current_names: [observed]
      coverage: {pods: partial}
