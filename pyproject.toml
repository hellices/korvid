[project]
name = "korvid"
version = "0.1.0"
description = "AI-native Kubernetes TUI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "kubernetes_asyncio>=32.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "regex>=2026.7.19",
]

[project.scripts]
korvid = "korvid.cli:main"

[project.optional-dependencies]
# Embedded AI agent: provider HTTP adapters + OS-keychain credential storage.
agent = [
    "httpx>=0.27",
    "keyring>=25.7.0",
]
# MCP adapter: expose read + UI-drive tools to external agents.
mcp = [
    # mcp 1.10.0 is the first release with mcp.server.transport_security
    # (DNS-rebinding protection), which korvid requires at import time.
    "mcp>=1.10,<2",
    # Imported directly by mcp/server.py, so declared directly even
    # though mcp already pulls them in (deptry flags transitive imports).
    "anyio>=4.5",
    "starlette>=0.36",
    "uvicorn>=0.30",
]
# Entra ID (Azure OpenAI) auth for the embedded agent.
entra = [
    "azure-identity>=1.19",
]
all = [
    "korvid[agent,mcp]",
]

[build-system]
# hatchling >=1.26 required: PEP 639 SPDX string form of `license` above
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korvid"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "pytest-randomly>=3.15",
    "mypy>=1.14",
    "ruff>=0.8",
    "tach>=0.23",
    "deptry>=0.20",
    "pre-commit>=4",
    "types-PyYAML",
    "azure-identity>=1.25.3",
    "types-regex>=2026.7.19.20260720",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP", "PT", "C90", "TID", "RUF", "S101"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
warn_unused_ignores = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --tb=short"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "contract: live-cluster contract tests (opt-in via KORVID_CONTRACT_RUN_ID)",
]

[tool.coverage.run]
branch = true
source = ["src/korvid"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.typos.files]
extend-exclude = ["*.lock", "*.snap"]

[tool.typos.default.extend-words]
aks = "aks"  # Azure Kubernetes Service — not a typo of "ask"

[tool.deptry]
known_first_party = ["korvid"]

[tool.deptry.per_rule_ignores]
# The [all] extra references the project's own extras (korvid[agent,mcp]).
DEP002 = ["korvid"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"
kubernetes_asyncio = "kubernetes_asyncio"
azure-identity = "azure"
