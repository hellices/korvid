site_name: korvid
site_description: A tool-using bird for your Kubernetes cluster
site_url: https://hellices.github.io/korvid/
repo_url: https://github.com/hellices/korvid
repo_name: hellices/korvid
docs_dir: docs
site_dir: site
strict: true
# Declared explicitly (it is also MkDocs' default) because every concept
# page's raw-HTML media is written as `../assets/…`, which only resolves
# while each page is served from its own directory (`/tui/`, not `/tui.html`).
use_directory_urls: true
exclude_docs: |
  overrides/
  dev/plans/
  superpowers/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  logo: assets/korvid-mark.svg
  favicon: assets/korvid-mark.svg
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    scheme: slate
    primary: black
    accent: amber

nav:
  - Home: index.md
  - Getting started:
      - Overview: overview.md
      - Install and quick start: getting-started.md
      - Keybindings: keybindings.md
  - Operate:
      - TUI: tui.md
      - Operations and safety: ops.md
      - Resource relationships: resource-relationships.md
      - Helm and operators: helm-operators.md
      - Observability: observability.md
  - AI and integrations:
      - Embedded agent: agent.md
      - MCP server: mcp.md
      - Provider plugins: provider-plugins.md
  - Administration:
      - Air-gapped operation: airgap.md
      - Performance and scale: performance.md
      - Threat model: threat-model.md
  - Project:
      - Architecture: dev/specs/2026-08-12-korvid-architecture.md
      - Contributor docs: dev/README.md
      - Quality gates: dev/quality-gates.md
      - Release notes:
          - Unreleased: release-notes/unreleased.md
          - v0.3.0: release-notes/v0.3.0.md
          - v0.2.0: release-notes/v0.2.0.md
          - v0.1.2: release-notes/v0.1.2.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - privacy:
      assets: true
      assets_fetch: false

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - assets/javascripts/visual-storytelling.js
