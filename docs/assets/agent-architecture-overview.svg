<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Korvid agent: current runtime composition</title>
  <desc id="desc">One DefaultAgentSession drives one NativeAgentEngine. ModelRouter selects the policy, tool surface and budgets before session creation; low and high are not separate agents. The session snapshots the workspace through AgentUiBridge. PromptHarness combines safety, role, tier and cluster context into ComposedPrompt. The engine coordinates ConversationState, RequestGateway, and ToolHarness. Only the gateway calls LLMProvider. Execution ports separate reads and screen actions from writes, which require actual user approval. All objects are wired in __main__.py.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182b44; }
      .title { font-size: 38px; font-weight: 750; }
      .subtitle { font-size: 19px; fill: #52647b; }
      .eyebrow { font-size: 14px; font-weight: 750; letter-spacing: 2px; fill: #476181; }
      .heading { font-size: 23px; font-weight: 700; }
      .name { font-size: 20px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #52647b; }
      .label { font-size: 15px; font-weight: 650; fill: #3b5d85; }
      .card { fill: #fff; stroke: #ccd7e4; stroke-width: 1.5; }
      .call { fill: none; stroke: #406693; stroke-width: 2.5; marker-end: url(#arrow); }
      .event { fill: none; stroke: #138078; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#event-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#406693"/></marker>
    <marker id="event-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#138078"/></marker>
  </defs>
  <rect width="1600" height="1000" rx="20" fill="#f4f7fb"/>
  <text x="40" y="45" class="eyebrow">01 / OVERVIEW</text>
  <text x="40" y="96" class="title">One agent loop. Explicit boundaries.</text>
  <text x="40" y="132" class="subtitle">Actual composition at aafdf263 / 2026-09-09 / component calls, not an import graph</text>

  <rect x="40" y="166" width="1520" height="66" rx="12" fill="#182b44"/>
  <text x="64" y="207" style="fill:#fff;font-size:22px;font-weight:700">__main__.py / _build_session()</text>
  <text x="565" y="207" style="fill:#d5e2f2;font-size:19px">Constructor injection: provider + resolved policy + cluster facts + UI ports</text>

  <rect x="24" y="292" width="320" height="480" rx="18" fill="#eaf4f3" stroke="#bfdbd6"/>
  <text x="44" y="319" class="eyebrow">TEXTUAL / UI</text>
  <rect x="40" y="340" width="288" height="140" rx="12" class="card"/>
  <text x="60" y="374" class="name">AgentUiController</text>
  <text x="60" y="407" class="body">User text / Ctrl-X</text>
  <text x="60" y="435" class="body">AgentPanel renders events</text>
  <text x="60" y="460" class="small">Follow reads / open citations</text>

  <rect x="400" y="340" width="360" height="140" rx="12" fill="#eaf0fc" stroke="#9eb5da" stroke-width="1.5"/>
  <text x="422" y="375" class="heading">DefaultAgentSession</text>
  <text x="422" y="410" class="body">Fresh workspace per turn</text>
  <text x="422" y="440" class="body">Owns iterator + interrupt lifecycle</text>
  <text x="422" y="465" class="small">AgentSession ABC</text>

  <rect x="810" y="292" width="750" height="480" rx="18" fill="#edf1f9" stroke="#c7d4e7"/>
  <text x="832" y="319" class="eyebrow">PURE PYTHON / AGENT ENGINE</text>
  <rect x="840" y="340" width="690" height="140" rx="12" fill="#294c7b"/>
  <text x="866" y="378" style="fill:#fff;font-size:27px;font-weight:750">NativeAgentEngine</text>
  <text x="866" y="414" style="fill:#e1eafa;font-size:19px">Sequence provider rounds, validate calls, dispatch sequentially</text>
  <text x="866" y="450" style="fill:#e1eafa;font-size:18px">One active turn / typed AgentEvent stream / AgentEngine ABC</text>

  <path d="M328 400H400" class="call"/>
  <text x="346" y="386" class="label">text</text>
  <path d="M760 400H840" class="call"/>
  <text x="772" y="386" class="label">request</text>
  <path d="M1185 340V265H185V340" class="event"/>
  <text x="442" y="255" class="label" style="fill:#138078">AgentEvent via session: text, tool progress, completion, errors</text>

  <rect x="40" y="610" width="288" height="140" rx="12" class="card"/>
  <text x="60" y="644" class="name">AgentWorkspaceBridge</text>
  <text x="60" y="677" class="body">AgentUiBridge ABC</text>
  <text x="60" y="706" class="body">snapshot() / apply(UiAction)</text>
  <text x="60" y="731" class="small">No write-approval authority</text>
  <path d="M184 610V540H440V480" class="call"/>
  <text x="207" y="527" class="label">InteractionContext</text>

  <rect x="400" y="610" width="360" height="140" rx="12" class="card"/>
  <text x="422" y="645" class="heading">PromptHarness</text>
  <text x="422" y="679" class="body">Safety + role + tier pack + rules</text>
  <text x="422" y="709" class="body">Cluster + handoff + workspace</text>
  <text x="422" y="734" class="small">Builds ComposedPrompt</text>
  <path d="M580 480V610" class="call"/>
  <text x="595" y="552" class="label">compose()</text>

  <path d="M1185 480V520H948V570" class="call"/>
  <path d="M1185 520V570" class="call"/>
  <path d="M1185 520H1418V570" class="call"/>
  <rect x="840" y="570" width="216" height="180" rx="12" class="card"/>
  <text x="856" y="605" class="name">ConversationState</text>
  <text x="856" y="642" class="body">Message history</text>
  <text x="856" y="671" class="body">Usage + provenance</text>
  <text x="856" y="700" class="body">Trim / rollback</text>
  <text x="856" y="731" class="small">In-memory state</text>

  <rect x="1077" y="570" width="216" height="180" rx="12" class="card"/>
  <text x="1093" y="605" class="name">RequestGateway</text>
  <text x="1093" y="642" class="body">OutboundPolicy</text>
  <text x="1093" y="671" class="body">Redact + bound</text>
  <text x="1093" y="700" class="body">Snapshot + stream</text>
  <text x="1093" y="731" class="small">Only model-call seam</text>

  <rect x="1310" y="570" width="216" height="180" rx="12" class="card"/>
  <text x="1326" y="605" class="name">ToolHarness</text>
  <text x="1326" y="642" class="body">Armed tools + limits</text>
  <text x="1326" y="671" class="body">Sanitized outcomes</text>
  <text x="1326" y="700" class="body">EvidenceLedger</text>
  <text x="1326" y="731" class="small">Read / UI / write split</text>

  <rect x="40" y="820" width="720" height="115" rx="12" fill="#fff" stroke="#ccd7e4"/>
  <text x="62" y="857" class="heading">ModelRouter resolves policy before session construction</text>
  <text x="62" y="890" class="body">Selected model capabilities + tier override + cluster environment</text>
  <text x="62" y="917" class="small">Produces prompt pack, tool surface and budgets. Low/high are not separate agents.</text>

  <rect x="1000" y="820" width="293" height="115" rx="12" fill="#edeafa" stroke="#c5bce5"/>
  <text x="1022" y="856" class="heading">LLMProvider</text>
  <text x="1022" y="889" class="body">LiteLLM / special flow</text>
  <text x="1022" y="917" class="small">One active model endpoint</text>
  <path d="M1185 750V785H1147V820" class="call"/>

  <rect x="1310" y="820" width="250" height="115" rx="12" fill="#fff4e2" stroke="#dec18d"/>
  <text x="1330" y="856" class="heading">Execution ports</text>
  <text x="1330" y="888" class="body">ToolExecutor / UI bridge</text>
  <text x="1330" y="917" class="small">Writes require user approval</text>
  <path d="M1418 750V820" class="call"/>
  <text x="40" y="975" class="small">Solid arrows: calls / input delivery. Dashed arrow: returned events. Boxes inside the engine area are collaborators, not subagents.</text>
</svg>
