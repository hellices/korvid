<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Korvid agent: provider rounds, tool routes and write gate</title>
  <desc id="desc">The session freezes screen context and prompt for a turn. Each engine round prepares history plus the current evidence table through RequestGateway, consumes a complete provider response, and dispatches accepted tool calls sequentially through ToolHarness. UI actions use AgentUiBridge; reads and write requests use ToolExecutor. Reads mint evidence. Writes wait for actual user approval and a persisted intent audit before UID-bound Kubernetes mutation. Context switching is separately blocked while the agent, a write or a dialog is active. Sanitized results feed the next round; a successful single direct-open call can finish without another model round.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182b44; }
      .title { font-size: 38px; font-weight: 750; }
      .subtitle { font-size: 19px; fill: #52647b; }
      .eyebrow { font-size: 14px; font-weight: 750; letter-spacing: 2px; fill: #476181; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #52647b; }
      .label { font-size: 16px; font-weight: 650; fill: #3b5d85; }
      .call { fill: none; stroke: #406693; stroke-width: 2.5; marker-end: url(#arrow); }
      .return { fill: none; stroke: #138078; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#back); }
      .gate { fill: none; stroke: #a96e0c; stroke-width: 2.5; marker-end: url(#gold); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#406693"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#138078"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a96e0c"/></marker>
  </defs>
  <rect width="1600" height="1280" rx="20" fill="#f4f7fb"/>
  <text x="40" y="45" class="eyebrow">02 / TURN AND TOOL DETAIL</text>
  <text x="40" y="96" class="title">Reason in rounds. Act through guarded ports.</text>
  <text x="40" y="132" class="subtitle">One turn may contain several model requests. Tool calls are always executed sequentially.</text>

  <rect x="40" y="168" width="1520" height="100" rx="12" fill="#182b44"/>
  <text x="64" y="203" style="fill:#fff;font-size:23px;font-weight:700">1  DefaultAgentSession</text>
  <text x="64" y="239" style="fill:#dce7f4;font-size:18px">snapshot() at turn start</text>
  <path d="M392 215H470" fill="none" stroke="#dce7f4" stroke-width="2"/>
  <text x="480" y="203" style="fill:#fff;font-size:23px;font-weight:700">2  PromptHarness</text>
  <text x="480" y="239" style="fill:#dce7f4;font-size:18px">Compose system + user messages</text>
  <path d="M883 215H970" fill="none" stroke="#dce7f4" stroke-width="2"/>
  <text x="980" y="203" style="fill:#fff;font-size:23px;font-weight:700">3  AgentTurnRequest</text>
  <text x="980" y="239" style="fill:#dce7f4;font-size:18px">Frozen prompt + policy + InteractionContext</text>

  <rect x="40" y="320" width="1520" height="370" rx="16" fill="#edf1f9" stroke="#c7d4e7"/>
  <text x="345" y="351" class="eyebrow">NATIVEAGENTENGINE / REPEATED PROVIDER ROUND</text>
  <path d="M1200 268V290H275V385" class="call"/>

  <rect x="70" y="385" width="425" height="190" rx="12" fill="#fff" stroke="#ccd7e4"/>
  <text x="92" y="422" class="heading">4  Prepare + send</text>
  <text x="92" y="458" class="body">ConversationState: history + provenance</text>
  <text x="92" y="490" class="body">System prefix + current evidence table</text>
  <text x="92" y="522" class="body">RequestGateway: redact / bound / snapshot</text>
  <text x="92" y="553" class="small">LLMProvider.complete() / transmission accounting</text>

  <rect x="580" y="385" width="425" height="190" rx="12" fill="#fff" stroke="#ccd7e4"/>
  <text x="602" y="422" class="heading">5  Consume + classify</text>
  <text x="602" y="458" class="body">Stream TextDelta to the panel</text>
  <text x="602" y="490" class="body">Require provider completion signal</text>
  <text x="602" y="522" class="body">Check IDs / names / arguments / call cap</text>
  <text x="602" y="553" class="small">Text-only answer: check citations + complete</text>

  <rect x="1090" y="385" width="440" height="190" rx="12" fill="#eaf0fc" stroke="#9eb5da"/>
  <text x="1112" y="422" class="heading">6  ToolHarness.execute()</text>
  <text x="1112" y="458" class="body">Only exact names armed by this policy</text>
  <text x="1112" y="490" class="body">Registry effect chooses the execution port</text>
  <text x="1112" y="522" class="body">Bound + sanitize ToolOutcome</text>
  <text x="1112" y="553" class="small">One stored call pairs with one stored result</text>
  <path d="M495 478H580" class="call"/>
  <path d="M1005 478H1090" class="call"/>
  <text x="1021" y="463" class="label">calls</text>

  <path d="M1160 575V622H283V575" class="return"/>
  <text x="351" y="611" class="label" style="fill:#138078">Sanitized results + newly minted evidence feed the next round</text>
  <text x="64" y="664" class="small">Budgets stop the loop. Oversized outbound requests may drop oldest completed turns, never split the active turn.</text>

  <path d="M1465 575V720H283V770" class="call"/>
  <path d="M795 720V770" class="call"/>
  <path d="M1305 720V770" class="call"/>
  <text x="64" y="710" class="eyebrow">THREE ROUTES / THE HARNESS WAITS FOR THE SELECTED PORT'S RESULT</text>

  <rect x="40" y="770" width="480" height="218" rx="12" fill="#eaf4f3" stroke="#bfdbd6"/>
  <text x="64" y="807" class="heading">A  UI-only action</text>
  <text x="64" y="845" class="body">Typed UiAction -&gt; AgentUiBridge.apply()</text>
  <text x="64" y="877" class="body">AgentWorkspaceBridge -&gt; TUI controllers</text>
  <text x="64" y="909" class="body">Navigate / filter / drill down / open panes</text>
  <text x="64" y="941" class="body">Returns post-action InteractionContext</text>
  <text x="64" y="972" class="small">No evidence minted. No cluster-write authority.</text>

  <rect x="560" y="770" width="480" height="218" rx="12" fill="#fff" stroke="#ccd7e4"/>
  <text x="584" y="807" class="heading">B  Read / diagnostic</text>
  <text x="584" y="845" class="body">ToolExecutor.execute_recorded()</text>
  <text x="584" y="877" class="body">KubeClient / deterministic diagnose_* tools</text>
  <text x="584" y="909" class="body">Optional Prometheus / Loki connectors</text>
  <text x="584" y="941" class="body">Successful read -&gt; EvidenceLedger [E1...]</text>
  <text x="584" y="972" class="small">Errors are not evidence; citations are checked.</text>

  <rect x="1080" y="770" width="480" height="218" rx="12" fill="#fff4e2" stroke="#dec18d"/>
  <text x="1104" y="807" class="heading">C  Write request</text>
  <text x="1104" y="845" class="body">ToolExecutor -&gt; tools-layer UIBridge</text>
  <text x="1104" y="877" class="body">AgentUiController.agent_request_write()</text>
  <text x="1104" y="909" class="body">Permission check / target UID / preview</text>
  <text x="1104" y="941" class="body">ConfirmScreen: fresh USER keystroke</text>
  <text x="1104" y="972" class="small">Deny / expire / unapproved interrupt: no mutation.</text>

  <rect x="40" y="1030" width="1000" height="186" rx="12" fill="#fff" stroke="#ccd7e4"/>
  <text x="64" y="1068" class="heading">Two important exit paths</text>
  <text x="64" y="1106" class="body">Fast open: one successful open_logs / open_describe, no discarded calls,</text>
  <text x="64" y="1136" class="body">continue_analysis != true -&gt; fixed local acknowledgement; no extra model round.</text>
  <text x="64" y="1174" class="body">Ctrl-X: close the turn iterator, repair conversation once, report TurnInterrupted.</text>
  <text x="64" y="1201" class="small">An already approved write is shielded: it completes with audit handling even if the agent turn stops.</text>

  <path d="M1320 988V1030" class="gate"/>
  <rect x="1080" y="1030" width="480" height="186" rx="12" fill="#fff4e2" stroke="#dec18d"/>
  <text x="1104" y="1068" class="heading">WriteCoordinator / shared write gate</text>
  <text x="1104" y="1106" class="body">Reserve in-flight write / shield completion</text>
  <text x="1104" y="1138" class="body">Persist intent audit BEFORE mutation</text>
  <text x="1104" y="1170" class="body">UID-bound K8s write -&gt; outcome audit</text>
  <text x="1104" y="1201" class="small">No intent audit = no write. Result returns via C.</text>
  <text x="40" y="1254" class="small">Evidence is turn-scoped; cleared again on context retarget. Validated citations are source references, not proof that the model's reasoning is correct.</text>
</svg>
