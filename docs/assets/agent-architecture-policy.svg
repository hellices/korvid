<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Korvid agent: model connection and resolved policy</title>
  <desc id="desc">One active model profile is resolved through the provider factory into a LiteLLM provider or a selected special flow. ModelRouter combines an explicit tier override, provider capability facts, shipped catalog facts and a conservative low fallback. Environment gates the tool surface. The resulting immutable policy supplies one engine, not a high/low multi-agent team.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182b44; }
      .title { font-size: 38px; font-weight: 750; }
      .subtitle { font-size: 19px; fill: #52647b; }
      .eyebrow { font-size: 14px; font-weight: 750; letter-spacing: 2px; fill: #476181; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #52647b; }
      .label { font-size: 16px; font-weight: 650; fill: #3b5d85; }
      .call { fill: none; stroke: #406693; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#406693"/></marker>
  </defs>
  <rect width="1600" height="1060" rx="20" fill="#f4f7fb"/>
  <text x="40" y="45" class="eyebrow">03 / CONNECTION AND POLICY</text>
  <text x="40" y="96" class="title">Choose a connection. Resolve how it may operate.</text>
  <text x="40" y="132" class="subtitle">Model selection is separate from execution policy. No per-prompt high/low model switching.</text>

  <rect x="40" y="175" width="570" height="718" rx="16" fill="#edeafa" stroke="#d0c8e8"/>
  <text x="64" y="210" class="eyebrow">A / CONNECTION CONSTRUCTION</text>
  <rect x="64" y="234" width="522" height="115" rx="12" fill="#fff" stroke="#d0c8e8"/>
  <text x="86" y="270" class="heading">agent.active -&gt; agent.profiles[name]</text>
  <text x="86" y="305" class="body">model reference / endpoint / auth / options</text>
  <text x="86" y="331" class="small">ModelConnectionConfig; one selected profile at a time</text>
  <path d="M325 349V397" class="call"/>

  <rect x="64" y="397" width="522" height="122" rx="12" fill="#fff" stroke="#d0c8e8"/>
  <text x="86" y="433" class="heading">create_provider_from_profile()</text>
  <text x="86" y="468" class="body">Validate profile / endpoint / trust / authentication</text>
  <text x="86" y="495" class="small">Credentials stay in env, keyring, or a declared auth chain.</text>
  <path d="M325 519V551H192V589" class="call"/>
  <path d="M325 551H459V589" class="call"/>

  <rect x="64" y="589" width="253" height="136" rx="12" fill="#fff" stroke="#d0c8e8"/>
  <text x="84" y="625" class="heading">Normal reference</text>
  <text x="84" y="660" class="body">LiteLLM routing</text>
  <text x="84" y="691" class="body">LiteLLMProvider</text>
  <rect x="337" y="589" width="249" height="136" rx="12" fill="#fff" stroke="#d0c8e8"/>
  <text x="357" y="625" class="heading">Claimed flow</text>
  <text x="357" y="660" class="body">GitHub device login</text>
  <text x="357" y="691" class="body">Ollama thinking opt-in</text>
  <path d="M192 725V754H325V788" class="call"/>
  <path d="M459 725V754H325" fill="none" stroke="#406693" stroke-width="2.5"/>

  <rect x="64" y="788" width="522" height="81" rx="12" fill="#65558e"/>
  <text x="86" y="823" style="fill:#fff;font-size:23px;font-weight:700">LLMProvider ABC</text>
  <text x="86" y="852" style="fill:#ebe6fa;font-size:18px">descriptor + capability facts + completion stream</text>

  <rect x="700" y="175" width="860" height="192" rx="12" fill="#fff" stroke="#ccd7e4"/>
  <text x="724" y="213" class="heading">B / ModelRouter: tier precedence</text>
  <text x="724" y="252" class="body">1  Explicit agent.model_tier override</text>
  <text x="724" y="284" class="body">2  Provider-reported recommended tier</text>
  <text x="1144" y="252" class="body">3  Shipped catalog recommendation</text>
  <text x="1144" y="284" class="body">4  Conservative fallback: LOW</text>
  <text x="724" y="339" class="small">Capability facts are merged with provenance; a model name alone is not proof of capability.</text>

  <rect x="700" y="418" width="860" height="149" rx="12" fill="#eaf4f3" stroke="#bfdbd6"/>
  <text x="724" y="456" class="heading">C / PolicyEnvironment + validated tool registry</text>
  <text x="724" y="494" class="body">Read-only mode / pod-resize support / configured observability backends</text>
  <text x="724" y="532" class="body">Choose exact armed tool schemas; no generic shell-execution tool.</text>
  <path d="M1130 367V418" class="call"/>
  <path d="M586 826H653V309H700" class="call"/>
  <text x="645" y="607" class="label" transform="rotate(-90 645 607)">descriptor + capabilities</text>

  <path d="M1130 567V620" class="call"/>
  <rect x="700" y="620" width="860" height="320" rx="12" fill="#fff" stroke="#9eb5da" stroke-width="1.5"/>
  <text x="724" y="659" class="heading">ResolvedAgentPolicy / frozen for the turn</text>
  <text x="724" y="691" class="small">Tier pack + overlays + tools + budgets + routing provenance</text>
  <path d="M724 711H1536" stroke="#d5deea"/>
  <text x="1040" y="744" class="heading">LOW</text>
  <text x="1320" y="744" class="heading">HIGH</text>
  <text x="724" y="777" class="body">Max provider rounds</text>
  <text x="1040" y="777" class="body">6</text>
  <text x="1320" y="777" class="body">15</text>
  <text x="724" y="806" class="body">History / result cap (chars)</text>
  <text x="1040" y="806" class="body">24,000 / 3,000</text>
  <text x="1320" y="806" class="body">120,000 / 8,000</text>
  <text x="724" y="835" class="body">Calls per round</text>
  <text x="1040" y="835" class="body">1</text>
  <text x="1320" y="835" class="body">1 unless confirmed*</text>
  <text x="724" y="864" class="body">Strict history budget</text>
  <text x="1040" y="864" class="body">Yes</text>
  <text x="1320" y="864" class="body">No; outbound bounded</text>
  <text x="724" y="904" class="small">* High: multiple calls require provider-confirmed supports_parallel_tools=true.</text>
  <text x="724" y="929" class="small">Accepted calls still run sequentially; otherwise extra calls are discarded.</text>

  <rect x="40" y="972" width="1520" height="52" rx="10" fill="#182b44"/>
  <text x="64" y="1006" style="fill:#fff;font-size:19px">Provider + resolved policy -&gt; one session / one engine. Model changes rebuild the session; environment changes retarget it.</text>
</svg>
