id: crashloop-missing-env
question: The orders pod in namespace shop keeps restarting. What is wrong with it?
screen: "resource view: pods, namespace shop, selected: shop/orders-1 (CrashLoopBackOff)"
root_cause: missing_config
grading:
  must_mention:
    - [database_url, environment variable, env var, environment]
    - [missing, not set, unset, required]
  must_not_mention:
    - [oomkilled, image pull]
  expected_evidence:
    - tool: diagnose_pod
      args: {pod: orders-1, namespace: shop}
      contains: "missing required environment variable DATABASE_URL"
cluster:
  objects:
    - kind: Pod
      apiVersion: v1
      metadata:
        name: orders-1
        namespace: shop
        uid: pod-orders-1
        creationTimestamp: "2026-07-27T06:00:00Z"
        labels: {app: orders}
      spec:
        nodeName: node-a
        containers:
          - name: orders
            image: shop/orders:v3
      status:
        phase: Running
        conditions:
          - {type: Ready, status: "False", reason: ContainersNotReady}
        containerStatuses:
          - name: orders
            ready: false
            restartCount: 7
            state:
              waiting: {reason: CrashLoopBackOff, message: "back-off 5m0s restarting failed container"}
            lastState:
              terminated: {exitCode: 1, reason: Error}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-a}
      status:
        conditions:
          - {type: Ready, status: "True"}
  events:
    - type: Warning
      reason: BackOff
      count: 22
      lastTimestamp: "2026-07-27T07:20:00Z"
      message: "Back-off restarting failed container orders in pod orders-1_shop"
      involvedObject: {kind: Pod, name: orders-1, namespace: shop, uid: pod-orders-1}
  logs:
    shop/orders-1/orders:
      current:
        - "orders service starting"
      previous:
        - "orders service starting"
        - "loading configuration from environment"
        - "fatal: missing required environment variable DATABASE_URL"
