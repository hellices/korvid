id: stuck-rollout
question: >-
  The api deployment in namespace shop was updated an hour ago but the rollout
  never finished. What is holding it up?
screen: "resource view: deployments, namespace shop, selected: shop/api (1/2 ready)"
root_cause: stuck_rollout_bad_image
grading:
  must_mention:
    - [progressdeadlineexceeded, progress deadline, rollout is stuck, rollout stuck,
       stuck rollout, not progressing, timed out progressing, rollout never finished,
       rollout has not finished]
    - [imagepullbackoff, errimagepull, image pull failure, image pull error,
       failed to pull, cannot pull, unable to pull, manifest unknown, manifest not found,
       v9-typo]
  must_not_mention:
    - [oomkilled, quota]
  expected_evidence:
    - tool: get_resource
      args: {kind: deployments, name: api, namespace: shop}
      contains: ProgressDeadlineExceeded
    - tool: diagnose_pod
      args: {pod: api-8f6b-1, namespace: shop}
      contains: ImagePullBackOff
cluster:
  objects:
    - kind: Deployment
      apiVersion: apps/v1
      metadata:
        name: api
        namespace: shop
        uid: deploy-api-1
      spec:
        replicas: 2
        selector:
          matchLabels: {app: api}
      status:
        replicas: 2
        updatedReplicas: 1
        readyReplicas: 1
        availableReplicas: 1
        unavailableReplicas: 1
        conditions:
          - type: Progressing
            status: "False"
            reason: ProgressDeadlineExceeded
            message: ReplicaSet "api-8f6b" has timed out progressing.
          - type: Available
            status: "False"
            reason: MinimumReplicasUnavailable
            message: Deployment does not have minimum availability.
    - kind: ReplicaSet
      apiVersion: apps/v1
      metadata:
        name: api-8f6b
        namespace: shop
        uid: rs-api-new
        ownerReferences:
          - {kind: Deployment, name: api, controller: true}
      spec: {replicas: 1}
      status: {replicas: 1, readyReplicas: 0}
    - kind: ReplicaSet
      apiVersion: apps/v1
      metadata:
        name: api-7c5a
        namespace: shop
        uid: rs-api-old
        ownerReferences:
          - {kind: Deployment, name: api, controller: true}
      spec: {replicas: 1}
      status: {replicas: 1, readyReplicas: 1}
    - kind: Pod
      apiVersion: v1
      metadata:
        name: api-8f6b-1
        namespace: shop
        uid: pod-api-new-1
        creationTimestamp: "2026-07-27T06:30:00Z"
        labels: {app: api}
        ownerReferences:
          - {kind: ReplicaSet, name: api-8f6b, controller: true}
      spec:
        nodeName: node-a
        containers:
          - name: api
            image: shop/api:v9-typo
      status:
        phase: Pending
        conditions:
          - {type: Ready, status: "False", reason: ContainersNotReady}
        containerStatuses:
          - name: api
            ready: false
            restartCount: 0
            state:
              waiting:
                reason: ImagePullBackOff
                message: Back-off pulling image "shop/api:v9-typo"
    - kind: Pod
      apiVersion: v1
      metadata:
        name: api-7c5a-1
        namespace: shop
        uid: pod-api-old-1
        creationTimestamp: "2026-07-27T05:00:00Z"
        labels: {app: api}
        ownerReferences:
          - {kind: ReplicaSet, name: api-7c5a, controller: true}
      spec:
        nodeName: node-b
        containers:
          - name: api
            image: shop/api:v8
      status:
        phase: Running
        conditions:
          - {type: Ready, status: "True"}
        containerStatuses:
          - name: api
            ready: true
            restartCount: 0
            state:
              running: {startedAt: "2026-07-27T05:00:10Z"}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-a}
      status:
        conditions:
          - {type: Ready, status: "True"}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-b}
      status:
        conditions:
          - {type: Ready, status: "True"}
  events:
    - type: Warning
      reason: Failed
      count: 8
      lastTimestamp: "2026-07-27T07:20:00Z"
      message: >-
        Failed to pull image "shop/api:v9-typo": rpc error: code = NotFound
        desc = manifest for shop/api:v9-typo not found: manifest unknown
      involvedObject: {kind: Pod, name: api-8f6b-1, namespace: shop, uid: pod-api-new-1}
  logs: {}
