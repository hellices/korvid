id: crashloop-dependency-unreachable
question: >-
  The billing pod in namespace shop keeps crashing shortly after start.
  What is causing the crashes?
interaction:
  kube_context: eval-fixture
  context_epoch: 1
  focused_pane:
    kind: pods
    scope: shop
    selected: {kind: Pod, namespace: shop, name: billing-1, uid: pod-billing-1}
root_cause: dependency_unreachable
grading:
  must_mention:
    - [postgres, database, db]
    - [connection refused, unreachable, cannot connect, can't connect,
       failed to connect, refused]
  must_not_mention:
    - [oomkilled, image pull]
  expected_evidence:
    - tool: diagnose_pod
      args: {pod: billing-1, namespace: shop}
      contains: "dial tcp 10.96.14.3:5432: connect: connection refused"
cluster:
  objects:
    - kind: Pod
      apiVersion: v1
      metadata:
        name: billing-1
        namespace: shop
        uid: pod-billing-1
        creationTimestamp: "2026-07-27T06:20:00Z"
        labels: {app: billing}
      spec:
        nodeName: node-b
        containers:
          - name: billing
            image: shop/billing:v7
      status:
        phase: Running
        conditions:
          - {type: Ready, status: "False", reason: ContainersNotReady}
        containerStatuses:
          - name: billing
            ready: false
            restartCount: 11
            state:
              waiting: {reason: CrashLoopBackOff, message: "back-off 5m0s restarting failed container"}
            lastState:
              terminated: {exitCode: 1, reason: Error}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-b}
      status:
        conditions:
          - {type: Ready, status: "True"}
  events:
    - type: Warning
      reason: BackOff
      count: 31
      lastTimestamp: "2026-07-27T07:29:00Z"
      message: "Back-off restarting failed container billing in pod billing-1_shop"
      involvedObject: {kind: Pod, name: billing-1, namespace: shop, uid: pod-billing-1}
  logs:
    shop/billing-1/billing:
      current:
        - "billing v7 starting"
      previous:
        - "billing v7 starting"
        - "connecting to postgres at postgres.shop.svc:5432"
        - "fatal: dial tcp 10.96.14.3:5432: connect: connection refused"
