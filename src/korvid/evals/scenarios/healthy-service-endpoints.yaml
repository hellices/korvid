id: healthy-service-endpoints
question: >-
  Users occasionally report slow responses from the search service in
  namespace front. Is anything wrong with the service or its pods?
screen: "resource view: services, namespace front, selected: front/search"
root_cause: none
grading:
  must_mention:
    - [healthy, no issues, no problems, looks fine, running normally,
       working as expected, nothing wrong]
  expected_evidence:
    - tool: get_resource
      args: {kind: endpoints, name: search, namespace: front}
      contains: "ip: 10.0.3.11"
    - tool: diagnose_pod
      args: {pod: search-7f9c-1, namespace: front}
      contains: "ready  restarts=0"
cluster:
  objects:
    - kind: Service
      apiVersion: v1
      metadata:
        name: search
        namespace: front
        uid: svc-search-1
      spec:
        selector: {app: search}
        ports:
          - {port: 80, targetPort: 8080}
    - kind: Endpoints
      apiVersion: v1
      metadata:
        name: search
        namespace: front
        uid: ep-search-1
      subsets:
        - addresses:
            - {ip: 10.0.3.11}
            - {ip: 10.0.3.12}
          ports:
            - {port: 8080}
    - kind: Pod
      apiVersion: v1
      metadata:
        name: search-7f9c-1
        namespace: front
        uid: pod-search-1
        creationTimestamp: "2026-07-25T09:00:00Z"
        labels: {app: search}
      spec:
        nodeName: node-a
        containers:
          - name: search
            image: front/search:v11
      status:
        phase: Running
        conditions:
          - {type: Ready, status: "True"}
        containerStatuses:
          - name: search
            ready: true
            restartCount: 0
            state:
              running: {startedAt: "2026-07-25T09:00:05Z"}
    - kind: Pod
      apiVersion: v1
      metadata:
        name: search-7f9c-2
        namespace: front
        uid: pod-search-2
        creationTimestamp: "2026-07-25T09:00:00Z"
        labels: {app: search}
      spec:
        nodeName: node-b
        containers:
          - name: search
            image: front/search:v11
      status:
        phase: Running
        conditions:
          - {type: Ready, status: "True"}
        containerStatuses:
          - name: search
            ready: true
            restartCount: 0
            state:
              running: {startedAt: "2026-07-25T09:00:06Z"}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-a}
      status:
        conditions:
          - {type: Ready, status: "True"}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-b}
      status:
        conditions:
          - {type: Ready, status: "True"}
  events: []
  logs:
    front/search-7f9c-1/search:
      current:
        - "search v11 serving queries, p99 84ms"
    front/search-7f9c-2/search:
      current:
        - "search v11 serving queries, p99 91ms"
