id: service-selector-mismatch
question: >-
  Requests to the web service in namespace front time out, but its pods look
  healthy. Why does the service not reach the pods?
interaction:
  kube_context: eval-fixture
  context_epoch: 1
  focused_pane:
    kind: services
    scope: front
    selected: {kind: Service, namespace: front, name: web, uid: svc-web-1}
root_cause: service_selector_mismatch
grading:
  must_mention:
    - [selector]
    - [mismatch, mismatched, does not match, doesn't match, do not match,
       don't match, no match, no matching, no endpoints, empty endpoints,
       no pods, wrong label, different label]
  must_not_mention:
    - [crashloopbackoff, oomkilled, image pull]
  expected_evidence:
    - tool: get_resource
      args: {kind: services, name: web, namespace: front}
      contains: "app: web-v2"
    - tool: get_resource
      args: {kind: endpoints, name: web, namespace: front}
      contains: "subsets: []"
    # The mismatching side: empty endpoints alone could also mean matching
    # but unready pods — the pod's actual label must have been observed.
    - tool: get_resource
      args: {kind: pods, name: web-6c4f-1, namespace: front}
      contains: "app: web"
cluster:
  objects:
    - kind: Service
      apiVersion: v1
      metadata:
        name: web
        namespace: front
        uid: svc-web-1
      spec:
        selector: {app: web-v2}
        ports:
          - {port: 80, targetPort: 8080}
    - kind: Endpoints
      apiVersion: v1
      metadata:
        name: web
        namespace: front
        uid: ep-web-1
      subsets: []
    - kind: Pod
      apiVersion: v1
      metadata:
        name: web-6c4f-1
        namespace: front
        uid: pod-web-1
        creationTimestamp: "2026-07-27T06:00:00Z"
        labels: {app: web}
      spec:
        nodeName: node-a
        containers:
          - name: web
            image: front/web:v2
      status:
        phase: Running
        conditions:
          - {type: Ready, status: "True"}
        containerStatuses:
          - name: web
            ready: true
            restartCount: 0
            state:
              running: {startedAt: "2026-07-27T06:00:05Z"}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-a}
      status:
        conditions:
          - {type: Ready, status: "True"}
  events: []
  logs:
    front/web-6c4f-1/web:
      current:
        - "web v2 listening on :8080"
