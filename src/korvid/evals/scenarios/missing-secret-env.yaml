id: missing-secret-env
question: >-
  Pod mailer-1 in namespace shop shows CreateContainerConfigError and never
  starts. What is wrong?
interaction:
  kube_context: eval-fixture
  context_epoch: 1
  focused_pane:
    kind: pods
    scope: shop
    selected: {kind: Pod, namespace: shop, name: mailer-1, uid: pod-mailer-1}
root_cause: missing_secret
grading:
  must_mention:
    - [secret]
    - [not found, missing, does not exist, doesn't exist, no such]
  must_not_mention:
    - [image pull, crashloopbackoff, oomkilled]
  expected_evidence:
    - tool: diagnose_pod
      args: {pod: mailer-1, namespace: shop}
      contains: "secret \"smtp-credentials\" not found"
cluster:
  objects:
    - kind: Pod
      apiVersion: v1
      metadata:
        name: mailer-1
        namespace: shop
        uid: pod-mailer-1
        creationTimestamp: "2026-07-27T07:05:00Z"
        labels: {app: mailer}
      spec:
        nodeName: node-b
        containers:
          - name: mailer
            image: shop/mailer:v2
            envFrom:
              - secretRef: {name: smtp-credentials}
      status:
        phase: Pending
        conditions:
          - {type: Ready, status: "False", reason: ContainersNotReady}
        containerStatuses:
          - name: mailer
            ready: false
            restartCount: 0
            state:
              waiting: {reason: CreateContainerConfigError, message: "secret \"smtp-credentials\" not found"}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-b}
      status:
        conditions:
          - {type: Ready, status: "True"}
  events:
    - type: Warning
      reason: Failed
      count: 16
      lastTimestamp: "2026-07-27T07:29:00Z"
      message: "Error: secret \"smtp-credentials\" not found"
      involvedObject: {kind: Pod, name: mailer-1, namespace: shop, uid: pod-mailer-1}
  logs: {}
