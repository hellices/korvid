id: healthy-deployment
question: Is the checkout deployment in namespace shop healthy right now?
screen: "resource view: deployments, namespace shop, selected: shop/checkout (2/2 ready)"
root_cause: none
grading:
  must_mention:
    - [healthy, no issues, no problems, looks fine, running normally, working as expected, fully available]
  expected_evidence:
    - tool: get_resource
      args: {kind: deployments, name: checkout, namespace: shop}
      contains: "readyReplicas: 2"
    - tool: diagnose_pod
      args: {pod: checkout-5b7d-1, namespace: shop}
      contains: "ready  restarts=0"
cluster:
  objects:
    - kind: Deployment
      apiVersion: apps/v1
      metadata:
        name: checkout
        namespace: shop
        uid: deploy-checkout-1
      spec:
        replicas: 2
        selector:
          matchLabels: {app: checkout}
      status:
        replicas: 2
        updatedReplicas: 2
        readyReplicas: 2
        availableReplicas: 2
        conditions:
          - {type: Available, status: "True", reason: MinimumReplicasAvailable}
          - {type: Progressing, status: "True", reason: NewReplicaSetAvailable}
    - kind: ReplicaSet
      apiVersion: apps/v1
      metadata:
        name: checkout-5b7d
        namespace: shop
        uid: rs-checkout-1
        ownerReferences:
          - {kind: Deployment, name: checkout, controller: true}
      spec: {replicas: 2}
      status: {replicas: 2, readyReplicas: 2}
    - kind: Pod
      apiVersion: v1
      metadata:
        name: checkout-5b7d-1
        namespace: shop
        uid: pod-checkout-1
        creationTimestamp: "2026-07-27T04:00:00Z"
        labels: {app: checkout}
        ownerReferences:
          - {kind: ReplicaSet, name: checkout-5b7d, controller: true}
      spec:
        nodeName: node-a
        containers:
          - name: checkout
            image: shop/checkout:v12
      status:
        phase: Running
        conditions:
          - {type: Ready, status: "True"}
        containerStatuses:
          - name: checkout
            ready: true
            restartCount: 0
            state:
              running: {startedAt: "2026-07-27T04:00:05Z"}
    - kind: Pod
      apiVersion: v1
      metadata:
        name: checkout-5b7d-2
        namespace: shop
        uid: pod-checkout-2
        creationTimestamp: "2026-07-27T04:00:00Z"
        labels: {app: checkout}
        ownerReferences:
          - {kind: ReplicaSet, name: checkout-5b7d, controller: true}
      spec:
        nodeName: node-b
        containers:
          - name: checkout
            image: shop/checkout:v12
      status:
        phase: Running
        conditions:
          - {type: Ready, status: "True"}
        containerStatuses:
          - name: checkout
            ready: true
            restartCount: 0
            state:
              running: {startedAt: "2026-07-27T04:00:06Z"}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-a}
      status:
        conditions:
          - {type: Ready, status: "True"}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-b}
      status:
        conditions:
          - {type: Ready, status: "True"}
  events: []
  logs:
    shop/checkout-5b7d-1/checkout:
      current:
        - "checkout v12 ready, serving traffic"
    shop/checkout-5b7d-2/checkout:
      current:
        - "checkout v12 ready, serving traffic"
