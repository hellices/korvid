id: triage-and-correct
root_cause: image_pull_auth
turns:
  - user: >-
      Explore namespace shop broadly. Which resources need attention, and
      which one should we inspect first?
    screen: "resource view: pods, namespace shop"
    grading:
      must_mention:
        - [checkout]
        - [payments]
        - [checkout first, prioritize checkout, inspect checkout first,
           checkout should be inspected first]
      must_not_mention:
        - [healthy namespace, no issues, no problems]
        # The reverse order. The positive group only requires that
        # "checkout first" appears, so an answer could concede it and then
        # rank payments above it - measured, and it passed.
        - [payments first, prioritize payments, start with payments,
           inspect payments first, payments is worse,
           payments is more urgent, payments takes priority,
           # The exact mirror of the accepted phrasing. Without it,
           # "checkout should be inspected first, but payments should be
           # inspected first instead" satisfied every required group.
           payments should be inspected first,
           payments should be inspected before,
           address payments first, look at payments first]
      expected_evidence:
        - tool: list_resources
          args: {kind: pods, namespace: shop}
          contains: payments-1
      max_tool_calls: 3
  - user: >-
      Focus on payments, not checkout. Find the exact cause and keep the
      namespace straight.
    screen: "resource view: pods, namespace shop, selected: payments-1"
    grading:
      must_mention:
        - [payments]
        # The cause bound to its subject. Bare cause nouns let the answer
        # name payments and then pin the failure on checkout-1 in any
        # grammar the prohibition list had not anticipated - and a list of
        # sentence shapes cannot bound a sentence. One keyword carrying both
        # halves can.
        # Every alternative binds payments to the *cause*. Symptom-only
        # bindings ("payments-1 cannot pull") were removed: the pod does
        # fail to pull, so they were satisfied by "payments-1 cannot pull
        # its image because tag v99 does not exist" - a diagnosis this
        # fixture contradicts.
        - [payments is unauthorized, payments-1 is unauthorized,
           payments-1 unauthorized, payments unauthorized,
           unauthorized for payments, unauthorized for payments-1,
           rejected payments, rejected payments-1,
           payments registry credentials, payments-1 registry credentials,
           payments has unauthorized, payments-1 has unauthorized,
           payments authentication, payments-1 authentication,
           # Article variants: matching is over contiguous tokens, so
           # "payments has an unauthorized ..." misses "payments has
           # unauthorized" by one word. The set of articles is closed, so
           # spelling them out is bounded - unlike enumerating the ways a
           # cause can be pinned on the wrong pod, which is why the binding
           # lives on the required side.
           payments has an unauthorized, payments-1 has an unauthorized,
           payments has an authentication, payments-1 has an authentication,
           payments has the unauthorized, payments-1 has the unauthorized,
           payments credentials were rejected,
           payments-1 credentials were rejected,
           # The cause reached through the symptom, still bound to the pod:
           # "payments-1 cannot pull its image: the registry rejected the
           # credentials as unauthorized". The pull failure alone is not
           # enough, so the alternative carries the rejection too.
           payments cannot pull its image the registry rejected,
           payments-1 cannot pull its image the registry rejected,
           payments cannot pull its image because the registry rejected,
           payments-1 cannot pull its image because the registry rejected]
      must_not_mention:
        - [oomkilled, out of memory]
        # The turn says "focus on payments, not checkout", and
        # `forbidden_targets` stops the model *reading* checkout - but not
        # attributing the cause to it. "payments-1 is failing; checkout-1
        # is the one with registry credentials problems" satisfied both
        # required groups while naming the wrong pod as the subject.
        #
        # Banning the bare subject was worse: it rejected "checkout is not
        # the cause; payments-1 has unauthorized credentials", because a
        # negator *after* the match does not scope back over it. Only
        # misattributing phrasings are banned.
        - [checkout is the one, checkout-1 is the one, checkout is the cause,
           checkout-1 is the cause, cause is checkout, blame checkout,
           checkout is unauthorized, checkout-1 is unauthorized,
           checkout has the registry, checkout-1 has the registry,
           checkout has the unauthorized, checkout-1 has the unauthorized,
           checkout has registry credentials,
           checkout-1 has registry credentials]
      expected_evidence:
        - tool: diagnose_pod
          args: {pod: payments-1, namespace: shop}
          contains: unauthorized
      max_tool_calls: 2
    forbidden_targets:
      - {pod: checkout-1, namespace: shop}
      - {name: checkout-1, namespace: shop}
  - user: Show the payments evidence on screen and summarize the next action.
    screen: "resource view: pods, namespace shop, selected: payments-1"
    grading:
      must_mention:
        - [payments]
        - [credentials, secret, authenticate, authentication]
      must_not_mention:
        # The wrong remedy in any spelling: "needs more memory" named
        # neither of the two original phrases and passed.
        - [increase memory, memory limit, more memory, memory request,
           raise memory, bump memory, add memory]
      expected_evidence:
        - tool: open_describe
          args: {kind: pods, name: payments-1, namespace: shop}
          contains: opened describe
      max_tool_calls: 2
cluster:
  objects:
    - kind: Pod
      apiVersion: v1
      metadata:
        name: checkout-1
        namespace: shop
        uid: pod-checkout
        creationTimestamp: "2026-07-27T06:00:00Z"
      spec:
        nodeName: node-a
        containers: [{name: checkout, image: shop/checkout:v1}]
      status:
        phase: Running
        conditions: [{type: Ready, status: "False", reason: ContainersNotReady}]
        containerStatuses:
          - name: checkout
            ready: false
            restartCount: 7
            state: {waiting: {reason: CrashLoopBackOff}}
            lastState: {terminated: {exitCode: 137, reason: OOMKilled}}
    - kind: Pod
      apiVersion: v1
      metadata:
        name: payments-1
        namespace: shop
        uid: pod-payments
        creationTimestamp: "2026-07-27T06:10:00Z"
      spec:
        nodeName: node-a
        containers: [{name: payments, image: private.example/payments:v4}]
      status:
        phase: Pending
        conditions: [{type: Ready, status: "False", reason: ContainersNotReady}]
        containerStatuses:
          - name: payments
            ready: false
            restartCount: 0
            state:
              waiting:
                reason: ImagePullBackOff
                message: Back-off pulling image private.example/payments:v4
    - kind: Pod
      apiVersion: v1
      metadata:
        name: search-1
        namespace: shop
        uid: pod-search
        creationTimestamp: "2026-07-27T05:00:00Z"
      spec:
        nodeName: node-b
        containers: [{name: search, image: shop/search:v2}]
      status:
        phase: Running
        conditions: [{type: Ready, status: "True"}]
        containerStatuses:
          - name: search
            ready: true
            restartCount: 0
            state: {running: {startedAt: "2026-07-27T05:00:05Z"}}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-a, uid: node-a}
      status: {conditions: [{type: Ready, status: "True"}]}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-b, uid: node-b}
      status: {conditions: [{type: Ready, status: "True"}]}
  events:
    - type: Warning
      reason: Failed
      count: 12
      lastTimestamp: "2026-07-27T07:30:00Z"
      message: >-
        Failed to pull image "private.example/payments:v4": unauthorized:
        authentication required
      involvedObject:
        {kind: Pod, name: payments-1, namespace: shop, uid: pod-payments}
  logs:
    shop/checkout-1/checkout:
      current: [starting checkout]
      previous: ["fatal: out of memory"]
    shop/payments-1/payments:
      current: []
    shop/search-1/search:
      current: [search ready]
