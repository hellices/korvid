id: rollout-owner-chain
root_cause: image_pull_typo
turns:
  - user: >-
      The api Deployment in namespace edge has been rolling out for a while
      and never finishes. Start from the Deployment and find out why.
    screen: "resource view: deployments, namespace edge, selected: edge/api"
    grading:
      # The rollout is stalled because the new ReplicaSet's pod cannot pull
      # its image. Reaching that requires the ownership chain — Deployment,
      # then the new ReplicaSet, then its Pod — which is exactly the
      # multi-hop traversal small models are weakest at.
      must_mention:
        - [imagepullbackoff, errimagepull, image pull, cannot pull,
           could not pull, pull the image, failed to pull, fails to pull,
           unable to pull, manifest not found]
        - [api-7b9d, v27, wrong tag, bad tag, tag does not exist,
           nonexistent tag, typo]
      must_not_mention:
        - [oomkilled, out of memory]
        - [readiness probe, liveness probe]
        - [quota, insufficient cpu, insufficient memory]
      expected_evidence:
        # The stalled rollout is visible on the Deployment itself.
        - - tool: get_resource
            args: {kind: deployments, name: api, namespace: edge}
            contains: "unavailableReplicas: 1"
          - tool: diagnose_workload
            args: {kind: deployments, name: api, namespace: edge}
            contains: api-7b9d
        # The failing pod's own state names the cause.
        - - tool: diagnose_pod
            args: {pod: api-7b9d-x1, namespace: edge}
            contains: ImagePullBackOff
          - tool: get_events
            args: {kind: pods, name: api-7b9d-x1, namespace: edge}
            contains: "not found"
      max_tool_calls: 6
  - user: >-
      Which ReplicaSet does that pod belong to, and is the previous one
      still serving traffic?
    screen: "resource view: pods, namespace edge, selected: edge/api-7b9d-x1"
    grading:
      # The old ReplicaSet is still up, which is why there is no outage —
      # a model that reports a total failure has misread the rollout.
      must_mention:
        - [api-7b9d]
        - [api-5c2f, previous, old replicaset, still serving, still running,
           still available]
      must_not_mention:
        - [outage, total failure, all pods are down, no pods running]
      expected_evidence:
        - - tool: get_resource
            args: {kind: replicasets, name: api-5c2f, namespace: edge}
            contains: "readyReplicas: 2"
          - tool: list_resources
            args: {kind: replicasets, namespace: edge}
            contains: api-5c2f
      max_tool_calls: 4
