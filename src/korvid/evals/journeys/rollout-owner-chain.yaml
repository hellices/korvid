  objects:
    - kind: Deployment
      apiVersion: apps/v1
      metadata:
        name: api
        namespace: edge
        uid: deploy-api-1
        creationTimestamp: "2026-07-27T04:00:00Z"
      spec:
        replicas: 3
        selector:
          matchLabels: {app: api}
      status:
        replicas: 3
        readyReplicas: 2
        availableReplicas: 2
        unavailableReplicas: 1
        updatedReplicas: 1
        conditions:
          - type: Available
            status: "True"
          - type: Progressing
            status: "False"
            reason: ProgressDeadlineExceeded
            message: ReplicaSet "api-7b9d" has timed out progressing.
    - kind: ReplicaSet
      apiVersion: apps/v1
      metadata:
        name: api-5c2f
        namespace: edge
        uid: rs-api-old
        creationTimestamp: "2026-07-27T04:00:00Z"
        labels: {app: api}
        ownerReferences:
          - {apiVersion: apps/v1, kind: Deployment, name: api, uid: deploy-api-1, controller: true}
      spec:
        replicas: 2
