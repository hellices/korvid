id: logs-to-events
root_cause: liveness_probe_failing
interaction:
  kube_context: eval-fixture
  context_epoch: 1
  focused_pane:
    kind: pods
    scope: front
    selected: {kind: Pod, namespace: front, name: gateway-1, uid: pod-gateway}
turns:
  - user: Why does gateway-1 in namespace front keep restarting?
    grading:
      must_mention:
        - [liveness probe, probe failure]
      must_not_mention:
        - [oomkilled, image pull]
      expected_evidence:
        - tool: diagnose_pod
          args: {pod: gateway-1, namespace: front}
          contains: Liveness probe failed
      max_tool_calls: 2
  - user: >-
      The application log looks normal. Verify the non-log evidence and tell
      me what Kubernetes is doing.
    grading:
      must_mention:
        - [liveness probe, probe failure]
        - [kubelet, restart, killed]
      must_not_mention:
        - [oomkilled, out of memory]
      expected_evidence:
        - tool: get_events
          args: {kind: pods, name: gateway-1, namespace: front}
          contains: Liveness probe failed
      max_tool_calls: 2
cluster:
  objects:
    - kind: Pod
      apiVersion: v1
      metadata:
        name: gateway-1
        namespace: front
        uid: pod-gateway
        creationTimestamp: "2026-07-27T06:00:00Z"
      spec:
        nodeName: node-a
        containers: [{name: gateway, image: front/gateway:v2}]
      status:
        phase: Running
        conditions: [{type: Ready, status: "True"}]
        containerStatuses:
          - name: gateway
            ready: true
            restartCount: 9
            state: {running: {startedAt: "2026-07-27T07:20:00Z"}}
            lastState: {terminated: {exitCode: 137, reason: Error}}
    - kind: Node
      apiVersion: v1
      metadata: {name: node-a, uid: node-a}
      status: {conditions: [{type: Ready, status: "True"}]}
  events:
    - type: Warning
      reason: Unhealthy
      count: 27
      lastTimestamp: "2026-07-27T07:30:00Z"
      message: "Liveness probe failed: context deadline exceeded"
      involvedObject:
        {kind: Pod, name: gateway-1, namespace: front, uid: pod-gateway}
  logs:
    front/gateway-1/gateway:
      current: [gateway serving traffic normally]
      previous: [gateway serving traffic normally]
