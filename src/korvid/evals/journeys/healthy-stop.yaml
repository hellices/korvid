id: healthy-stop
root_cause: none
turns:
  - user: Explore namespace catalog. Is anything unhealthy right now?
    screen: "resource view: pods, namespace catalog"
    grading:
      must_mention:
        - [healthy, no issues, no problems, running normally]
      must_not_mention:
        - [oomkilled, crashloopbackoff, imagepullbackoff]
      expected_evidence:
        - tool: list_resources
          args: {kind: pods, namespace: catalog}
          contains: catalog-1
        - tool: get_events
          args: {kind: pods, name: catalog-1, namespace: catalog}
          contains: "(no events)"
        - tool: get_events
          args: {kind: pods, name: catalog-2, namespace: catalog}
          contains: "(no events)"
      max_tool_calls: 3
  - user: Recheck catalog-1 warnings. Do we need to investigate further, or stop?
    screen: "resource view: pods, namespace catalog"
    grading:
      must_mention:
        - [stop, no further, no need, healthy]
      must_not_mention:
        - [failure, failing, broken]
      expected_evidence:
        - tool: get_events
          args: {kind: pods, name: catalog-1, namespace: catalog}
          contains: "(no events)"
      max_tool_calls: 1
cluster:
  objects:
    - kind: Pod
      apiVersion: v1
      metadata:
        name: catalog-1
        namespace: catalog
        uid: pod-catalog-1
        creationTimestamp: "2026-07-27T05:00:00Z"
      spec:
        nodeName: node-a
        containers: [{name: catalog, image: shop/catalog:v3}]
      status:
        phase: Running
        conditions: [{type: Ready, status: "True"}]
        containerStatuses:
          - name: catalog
            ready: true
            restartCount: 0
            state: {running: {startedAt: "2026-07-27T05:00:05Z"}}
    - kind: Pod
      apiVersion: v1
      metadata:
        name: catalog-2
        namespace: catalog
        uid: pod-catalog-2
        creationTimestamp: "2026-07-27T05:00:00Z"
      spec:
        nodeName: node-b
        containers: [{name: catalog, image: shop/catalog:v3}]
      status:
        phase: Running
        conditions: [{type: Ready, status: "True"}]
        containerStatuses:
          - name: catalog
            ready: true
            restartCount: 0
            state: {running: {startedAt: "2026-07-27T05:00:06Z"}}
  events: []
  logs:
    catalog/catalog-1/catalog:
      current: [catalog serving]
    catalog/catalog-2/catalog:
      current: [catalog serving]
