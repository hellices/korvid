name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede a PR's older runs when new commits arrive; never cancel a run on
# main, where the result is the record that a merged commit was verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs are load-bearing for the suite - tests assert README, SECURITY.md,
  # docs/keybindings.md and docs/windows.md still match the code and the
  # release workflow - so a docs edit must still be tested. It does not need
  # testing four times: those contracts are not Python-version or OS
  # specific. Classify the change here so the redundant legs can skip the
  # 20-30 minute pytest step while still reporting (they are required checks,
  # and a required check that never runs blocks the merge forever).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fail closed: anything that is not a pull request whose file list we
          # can read is treated as a code change and gets the full matrix.
          if [ -z "${PR:-}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request; running everything"
            exit 0
          fi
          echo "FORCED docs-only for the skip-path proof"; echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          # Docs-only means every path is under docs/ or is a root .md file.
          if printf '%s\n' "$files" | grep -qvE '^(docs/.*|[^/]+\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only: one full test pass instead of four"
          fi

  test:
    needs: changes
    runs-on: korvid-runners
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --dev --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy
      - run: uv run tach check
      - run: uvx deptry src/
      # A docs-only change still gets a full suite run, on one version.
      - if: needs.changes.outputs.code == 'true' || matrix.python-version == '3.12'
        run: uv run pytest --cov --cov-fail-under=80

  windows-test:
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --dev --all-extras
      # Windows verifies OS-specific behaviour; docs contracts are not that.
      - if: needs.changes.outputs.code == 'true'
        run: uv run pytest -q

  pre-commit:
    runs-on: korvid-runners
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev --all-extras
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  security:
    runs-on: korvid-runners
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      # Dependency vulnerability audit against the locked resolution
      - run: uv export --frozen --no-emit-project --no-dev -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --disable-pip
      # Static analysis of GitHub Actions workflows themselves
      - run: uvx zizmor --min-severity medium .github/workflows/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: korvid-runners
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  ty-experimental:
    runs-on: korvid-runners
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uvx ty check src/ || true
