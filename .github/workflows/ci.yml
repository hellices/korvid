name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede a PR's older runs when new commits arrive. Non-PR events get a
# unique group: GitHub cancels a *pending* run when a newer one joins the
# group even with cancel-in-progress off, so sharing a group on main would
# let a burst of merges discard the middle commit's verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs are load-bearing for the suite - tests assert README, SECURITY.md,
  # docs/keybindings.md and docs/windows.md still match the code and the
  # release workflow - so a docs edit must still be tested. It does not need
  # testing four times: those contracts are not Python-version or OS
  # specific. Classify the change here so the redundant legs can skip the
  # 20-30 minute pytest step while still reporting (they are required checks,
  # and a required check that never runs blocks the merge forever).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reading the PR's file list needs more than the workflow-level
    # `contents: read`; without this the API call 404s on every PR.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Fail closed: anything we cannot positively identify as docs-only
          # gets the full matrix. That includes a failed API call - exiting
          # non-zero here would *skip* the dependent test jobs rather than run
          # them, and a skipped required check never reports.
          if [ -z "${PR:-}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request; running everything"
            exit 0
          fi
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename'); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "could not read the file list; running everything"
            exit 0
          fi
          echo "$files"
          # Docs-only means every path is under docs/ or is a root .md file.
          # grep must consume the whole list: `grep -q` stops at the first hit
          # and SIGPIPEs the writer, which under pipefail fails the pipeline
          # and would read as docs-only - skipping tests on a code change.
          non_docs=$(printf '%s\n' "$files" | { grep -cvE '^(docs/.*|[^/]+\.md)$' || true; })
          if [ "${non_docs:-1}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only: one full test pass instead of four"
          fi

      # Pick the Linux pool for the jobs below. `korvid-runners` is persistent
      # shared infrastructure the release jobs also use, so it takes pushes to
      # main, and pull-request code only when the repository owner wrote and
      # pushed it and it brings in no third-party code: no lockfile, project
      # metadata, pre-commit hook or workflow change. Fail closed: anything
      # not positively identified as one of those - a trigger added later
      # included - goes to `ubuntu-latest`.
      - name: Select the Linux runner
        id: runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          hosted() {
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            echo "ubuntu-latest: $1"
            exit 0
          }
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "runner=korvid-runners" >> "$GITHUB_OUTPUT"
            echo "korvid-runners: push to main"
            exit 0
          fi
          [ "$EVENT_NAME" = "pull_request" ] || hosted "'$EVENT_NAME' run on '$REF' is neither a push to main nor a pull request"
          if [ -z "$REPO" ] || [ -z "$OWNER" ] || [ -z "$PR" ] || [ -z "$HEAD_SHA" ]; then
            hosted "missing repository or pull request context"
          fi
          # Only a push says who supplied the head: on `opened`/`reopened`
          # the actor is whoever opened the PR, not whoever pushed the branch.
          [ "$EVENT_ACTION" = "synchronize" ] || hosted "'$EVENT_ACTION' event does not identify who pushed the head"
          [ "$HEAD_REPO" = "$REPO" ] || hosted "head branch is not in $REPO"
          [ "$PR_AUTHOR" = "$OWNER" ] || hosted "opened by '$PR_AUTHOR', not the owner"
          [ "$ACTOR" = "$OWNER" ] || hosted "pushed by '$ACTOR', not the owner"
          [ "$TRIGGERING_ACTOR" = "$OWNER" ] || hosted "started by '$TRIGGERING_ACTOR', not the owner"
          # A rename reports its old path in `previous_filename`.
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
            hosted "could not read the file list"
          fi
          # The list describes the PR's current head; a later push would make
          # it describe a commit other than the one this run checks out. It
          # also stops at 3000 files, so a longer list may omit an excluded path.
          if ! pull_request=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.head.sha) \(.changed_files)"'); then
            hosted "could not read the pull request"
          fi
          read -r current_head changed_files <<< "$pull_request"
          [ "$current_head" = "$HEAD_SHA" ] || hosted "head moved while the file list was read"
          case "$changed_files" in ''|*[!0-9]*) hosted "changed-file count '$changed_files' is not a number" ;; esac
          [ "$changed_files" -le 3000 ] || hosted "$changed_files changed files exceed the 3000 the file list returns"
          # Count every match rather than `grep -q`; see the classifier above.
          third_party=$(printf '%s\n' "$files" | { grep -cE '^(uv\.lock|pyproject\.toml|\.pre-commit-config\.yaml|\.github/.*)$' || true; })
          [ "${third_party:-1}" -eq 0 ] || hosted "changes dependencies, hooks or workflows"
          echo "runner=korvid-runners" >> "$GITHUB_OUTPUT"
          echo "korvid-runners: owner pull request without third-party changes"

  test:
    needs: changes
    runs-on: ${{ needs.changes.outputs.runner == 'korvid-runners' && 'korvid-runners' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --dev --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy
      - run: uv run tach check
      - run: uvx deptry src/
      # A docs-only change still gets a full suite run, on one version.
      - if: needs.changes.outputs.code == 'true' || matrix.python-version == '3.12'
        run: uv run pytest --cov --cov-fail-under=80

  windows-test:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --dev --all-extras
      - name: Report pytest-randomly seed
        run: 'Write-Output "pytest-randomly seed: ${{ github.run_id }}"'
      # This Node subprocess harness is stable in a fresh pytest process but
      # can time out after prolonged execution in the shared Windows process.
      - name: Exercise the docs landing harness in a fresh process
        if: needs.changes.outputs.code == 'true'
        run: uv run pytest -p no:tach tests/test_docs_landing_behavior.py -q --randomly-seed=${{ github.run_id }}
      - name: Exercise the native Windows terminal
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 5
        env:
          KORVID_WINDOWS_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/korvid-native-terminal
        run: uv run pytest -p no:tach tests/windows/test_native_terminal.py tests/core/test_audit.py::test_concurrent_appends_across_instances -q
      - name: Upload native Windows terminal evidence
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-native-terminal
          path: |
            ${{ runner.temp }}/korvid-native-terminal/**/witness/*.json
            ${{ runner.temp }}/korvid-native-terminal/**/conpty-output.bin
          retention-days: 7
      # The docs landing harness ran above in a fresh process; do not execute
      # it a second time in the long-lived Windows pytest process.
      - if: needs.changes.outputs.code == 'true'
        run: uv run pytest -q --ignore=tests/windows/test_native_terminal.py --ignore=tests/test_docs_landing_behavior.py --deselect=tests/core/test_audit.py::test_concurrent_appends_across_instances --randomly-seed=${{ github.run_id }}

  pre-commit:
    needs: changes
    # Run on the hosted fallback even if `changes` failed: a required job
    # skipped by a failed `needs` reports as passing.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.runner == 'korvid-runners' && 'korvid-runners' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev --all-extras
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  security:
    needs: changes
    # Run on the hosted fallback even if `changes` failed: a required job
    # skipped by a failed `needs` reports as passing.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.runner == 'korvid-runners' && 'korvid-runners' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      # Dependency vulnerability audit against the locked resolution.
      # --all-extras, because `korvid[agent]` and `korvid[mcp]` are supported
      # installs: auditing the base set alone leaves an httpx or starlette
      # advisory invisible until release verification catches it.
      - run: uv export --frozen --all-extras --no-emit-project --no-dev -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --disable-pip
      # Static analysis of GitHub Actions workflows themselves
      - run: uvx zizmor --min-severity medium .github/workflows/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  ty-experimental:
    needs: changes
    # Run on the hosted fallback even if `changes` failed: a required job
    # skipped by a failed `needs` reports as passing.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.runner == 'korvid-runners' && 'korvid-runners' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked --dev --all-extras
      - run: uv run --with ty ty check src/
        continue-on-error: true
