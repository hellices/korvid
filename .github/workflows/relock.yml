name: Relock

# Regenerate `uv.lock` from a runner with direct PyPI access.
#
# `uv lock` needs to fetch wheel metadata from files.pythonhosted.org, so a
# contributor behind a TLS-intercepting corporate proxy cannot produce a
# usable lock at all: locking through the mirror rewrites every URL to an
# internal host, which `no-private-index-in-lock` and tests/test_lockfile.py
# both reject - correctly, but that leaves no way forward. Dependabot covers
# routine bumps; this covers the deliberate ones, such as taking a major
# version that needs source changes in the same pull request.
#
# It pushes a branch and opens a pull request. It never writes to main, and
# the lock it produces is verified *inside this job* — because it has to be.
# GitHub suppresses the workflow events raised by `GITHUB_TOKEN`, so the pull
# request this opens will not start CI on its own. Rather than introduce a
# PAT or an app installation for the privilege of triggering ourselves, the
# job runs the checks that matter before the branch exists: the same lint,
# type-check, layer and test gate CI would run, plus the PyPI-only assertion
# that is the whole reason this workflow is trusted.
#
# A reviewer must still push an empty commit (or close and reopen the pull
# request) to get the full matrix — Windows and the other interpreters — and
# the pull request body says so rather than implying it happened.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to upgrade (blank = re-resolve everything)"
        required: false
        type: string
      base:
        description: "Branch to lock on top of"
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.base }}
          # The push below uses the checkout credential deliberately; the
          # branch it writes is a throwaway `relock/*` that only a pull
          # request can land.
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: false

      - name: Regenerate the lock
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -n "$PACKAGE" ]; then
            uv lock --upgrade-package "$PACKAGE"
          else
            uv lock --upgrade
          fi

      # The guard that makes this workflow safe to trust. A GitHub runner
      # resolves from PyPI, so this should never fire - but the whole point
      # of the job is producing a lock nobody can regenerate locally, and an
      # unverified one is worth less than none.
      - name: Refuse a lock that names anything but PyPI
        run: |
          if grep -nE '(url|registry|index) = "https?://' uv.lock \
             | grep -vE 'https://(files\.pythonhosted\.org|pypi\.org)/'; then
            echo "uv.lock names a non-PyPI host"
            exit 1
          fi

      - name: Verify the project still resolves and passes the gate
        # Deliberately the whole gate, not just the tests. The pull request
        # this opens cannot start CI (see the note at the top), so whatever
        # is not checked here is not checked before a human reads it.
        run: |
          uv sync --locked --dev --all-extras
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
          uv run mypy src/
          uv run tach check
          uv run pytest -q

      - name: Open a pull request with the result
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          BASE: ${{ inputs.base }}
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already up to date; nothing to do"
            exit 0
          fi
          target="${PACKAGE:-all dependencies}"
          branch="relock/$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add uv.lock
          git commit -m "build: relock ${target}

          Regenerated by the Relock workflow, which runs on a runner with
          direct PyPI access. Locking is not possible from a machine behind
          a TLS-intercepting mirror: the resulting lock names the mirror,
          and the repository rejects that.
          "
          git push origin "$branch"
          gh pr create \
            --base "$BASE" \
            --head "$branch" \
            --title "build: relock ${target}" \
            --body "Regenerated \`uv.lock\` on a runner with direct PyPI access.

          Verified in the job that produced it, before this pull request
          existed: every \`url\`, \`registry\` and \`index\` in the lock names
          PyPI, \`uv sync --locked\` succeeds against it, and ruff, the format
          check, mypy, tach and the test suite all pass on Linux/3.12.

          **CI has not run on this branch and will not start by itself.**
          GitHub suppresses the workflow events raised by \`GITHUB_TOKEN\`, so
          the checks above are all that has happened. Push an empty commit,
          or close and reopen this pull request, to get the full matrix —
          Windows, the other interpreters, CodeQL and the security audit —
          before merging.

          Opened by the \`Relock\` workflow."
