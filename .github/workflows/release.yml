name: Release

# Signed PyPI releases with SBOMs and verified offline bundles (issue #169).
# Publication is triggered only by an annotated vX.Y.Z tag; the tag must match
# pyproject.toml or nothing is built. One build's artifacts are promoted to
# both PyPI (OIDC Trusted Publishing — no stored token) and the GitHub
# Release. Every gate below is fail-closed for publication.
#
# workflow_dispatch is a non-publishing dry run from main. It runs verify,
# build, smoke, sbom, offline, and collect. It deliberately stops before
# `attest` (public Sigstore/Rekor provenance is irreversible), staging,
# PyPI publication, and finalization.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: korvid-runners
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          # Source policy checks both the annotated tag object and whether
          # its commit is reachable from origin/main.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.10.9"
          # Publishing workflow: caching is a poisoning vector (zizmor).
          enable-cache: false
      - name: Fetch the live trusted source refs
        # actions/checkout can leave refs/remotes/origin/main pointing at the
        # ref this run was dispatched from, which would make the dry run's
        # HEAD == origin/main comparison vacuous. Refresh it from the remote
        # before any source policy reads it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          if [ "$EVENT_NAME" = "push" ]; then
            git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          fi
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version=$(uv run --no-project python scripts/release/check_version.py "$TAG")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "manual dry runs only support refs/heads/main"
              exit 1
            fi
            version=$(uv run --no-project python scripts/release/check_dry_run.py origin/main)
          else
            echo "unsupported release event"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: source
        name: Require trusted source for release publication or dry run
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            uv run --no-project python scripts/release/check_source.py \
              "$TAG" origin/main
            # check_source deliberately logs no hashes (CodeQL). Export the
            # verified commit directly through GitHub's output channel.
            source_commit=$(git rev-list -n 1 "refs/tags/$TAG")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            source_commit=$(git rev-parse HEAD)
          else
            echo "unsupported release event"
            exit 1
          fi
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked --dev --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run mypy
      - run: uv run tach check
      - run: uvx deptry src/
      - run: uv run pytest --cov --cov-fail-under=80
      # Vulnerability audit against the locked resolution (fail-closed).
      - run: uv export --frozen --all-extras --no-emit-project --no-dev -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --disable-pip

  build:
    needs: verify
    runs-on: korvid-runners
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.10.9"
          # Publishing workflow: caching is a poisoning vector (zizmor).
          enable-cache: false
      # Built exactly once; these files are promoted to PyPI and the
      # GitHub Release without rebuilding.
      - run: uv build --build-constraints scripts/release/build-constraints.txt --require-hashes
      - name: Verify wheel and sdist metadata before promotion
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project python scripts/release/check_artifacts.py \
            --dist dist --version "$VERSION"
      - name: Record the environment that built the artifacts
        env:
          COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: |
          uv run --no-project python scripts/release/metadata.py \
            --output release-metadata.json --commit "$COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-metadata
          path: release-metadata.json
          if-no-files-found: error

  smoke:
    needs: [verify, build]
    runs-on: ${{ matrix.os }}
    # 36 cells, each building two clean virtual environments; a hung cell must
    # never stall a release.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        variant: [base, agent, mcp, all]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Smoke-test the downloaded wheel in a clean workspace
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VARIANT: ${{ matrix.variant }}
          WORKSPACE: ${{ runner.temp }}/smoke-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.variant }}
        run: |
          python scripts/release/smoke_install.py \
            --wheel "dist/korvid-${VERSION}-py3-none-any.whl" \
            --version "$VERSION" \
            --variant "$VARIANT" \
            --workspace "$WORKSPACE"

  sbom:
    needs: [verify, build]
    runs-on: korvid-runners
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.10.9"
          # Publishing workflow: caching is a poisoning vector (zizmor).
          enable-cache: false
      # CycloneDX SBOM over korvid plus the full locked runtime graph
      # (all extras, no dev), generated from the committed uv.lock.
      - run: uv export --frozen --all-extras --no-dev -o requirements-sbom.txt
      - name: Generate and validate the complete SBOM
        run: |
          uvx --from 'cyclonedx-bom==7.3.1' cyclonedx-py requirements \
            requirements-sbom.txt --pyproject pyproject.toml \
            --output-reproducible --of JSON -o sbom.cdx.json
          uv run --no-project python scripts/release/check_sbom.py \
            --sbom sbom.cdx.json --requirements requirements-sbom.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  offline:
    needs: [verify, build]
    env:
      # glibc 2.28 is the declared Linux compatibility floor. The digest
      # prevents a moving image from silently changing wheel selection.
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:622a0041b2daf9865d38d7a14ae913a66d103db7b15fdedbcf513353d106183e
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    # Native runners on purpose: each wheelhouse must contain real install
    # candidates for its platform, not cross-platform guesses.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.10.9"
          python-version: ${{ matrix.python-version }}
          # Publishing workflow: caching is a poisoning vector (zizmor).
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: Build the platform wheelhouse from the locked resolution
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          PYVER: ${{ matrix.python-version }}
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project -o requirements-offline.txt
          mkdir -p wheelhouse
          if [ "$RUNNER_OS_NAME" = Linux ]; then
            py_tag=${PYVER//./}
            docker run --rm \
              --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:/io" -w /io "$MANYLINUX_IMAGE" \
              "/opt/python/cp${py_tag}-cp${py_tag}/bin/python" \
              -m pip wheel -r requirements-offline.txt -w wheelhouse
          else
            python -m pip install --upgrade pip wheel
            python -m pip wheel -r requirements-offline.txt -w wheelhouse
          fi
          cp dist/*.whl wheelhouse/
      - name: SBOM for the bundle (same locked graph)
        shell: bash
        run: |
          uvx --from 'cyclonedx-bom==7.3.1' cyclonedx-py requirements \
            requirements-offline.txt --pyproject pyproject.toml \
            --output-reproducible --of JSON -o sbom.cdx.json
          python scripts/release/check_sbom.py \
            --sbom sbom.cdx.json --requirements requirements-offline.txt
      - name: Assemble the bundle
        id: assemble
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RUNNER_OS_NAME: ${{ runner.os }}
          PYVER: ${{ matrix.python-version }}
        run: |
          case "$RUNNER_OS_NAME" in
            Linux) platform_tag="linux-manylinux_2_28-x86_64" ;;
            Windows) platform_tag="windows-x86_64" ;;
            *) echo "unsupported runner $RUNNER_OS_NAME"; exit 1 ;;
          esac
          archive=$(python scripts/release/bundle.py \
            --version "$VERSION" --platform-tag "$platform_tag" \
            --python-tag "$PYVER" --wheels wheelhouse \
            --sbom sbom.cdx.json --output out)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Verify the published archive offline
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCHIVE: ${{ steps.assemble.outputs.archive }}
          RUNNER_OS_NAME: ${{ runner.os }}
          PYVER: ${{ matrix.python-version }}
          # Belt and braces: even a bug that dropped --no-index must not
          # find an index during verification.
          PIP_INDEX_URL: http://127.0.0.1:1/
        run: |
          # offline_verify extracts the .tar.gz/.zip into a fresh directory,
          # then checks checksums, installs with --no-index, exercises the
          # generated korvid/korvid.exe launcher, and runs the negative check.
          if [ "$RUNNER_OS_NAME" = Linux ]; then
            py_tag=${PYVER//./}
            docker run --rm \
              --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -e PIP_INDEX_URL="$PIP_INDEX_URL" \
              -v "$PWD:/io" -w /io "$MANYLINUX_IMAGE" \
              "/opt/python/cp${py_tag}-cp${py_tag}/bin/python" \
              scripts/release/offline_verify.py \
              --archive "$ARCHIVE" --version "$VERSION"
          else
            python scripts/release/offline_verify.py \
              --archive "$ARCHIVE" --version "$VERSION"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ steps.assemble.outputs.archive }}
          if-no-files-found: error

  collect:
    needs: [build, sbom, offline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
      - name: Collect every release asset and generate complete checksums
        run: |
          python scripts/release/release_manifest.py \
            --artifacts artifacts --output release-files
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  attest:
    needs: [verify, collect, smoke]
    # Provenance attestation signs through public Sigstore and records the
    # entry in the public Rekor transparency log. That is irreversible, so it
    # only ever runs for a real tag push — never for a dry run.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-files
          path: release-files
      - name: Revalidate the remote tag immediately before attestation
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: |
          git fetch --force origin \
            "+refs/tags/$TAG:refs/tags/$TAG" \
            "refs/heads/main:refs/remotes/origin/main"
          python scripts/release/check_source.py "$TAG" origin/main \
            --expected-commit "$EXPECTED_COMMIT"
      # Verifiable build provenance for the wheel, sdist, SBOM, checksums,
      # metadata, and every offline archive.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: release-files/*

  stage-github-release:
    needs: [verify, smoke, attest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-files
          path: release-files
      - name: Revalidate the remote tag before staging the release
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: |
          git fetch --force origin \
            "+refs/tags/$TAG:refs/tags/$TAG" \
            "refs/heads/main:refs/remotes/origin/main"
          python scripts/release/check_source.py "$TAG" origin/main \
            --expected-commit "$EXPECTED_COMMIT"
      - name: Stage an idempotent draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$REPO" \
              --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "a non-draft release already exists for $TAG"
              exit 1
            fi
            mkdir existing-release
            gh release download "$TAG" --repo "$REPO" --dir existing-release
            python scripts/release/compare_assets.py \
              release-files existing-release
          else
            status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/korvid/$VERSION/json")
            if [ "$status" = 200 ]; then
              echo "PyPI version exists but no matching draft release; refusing recovery"
              exit 1
            elif [ "$status" != 404 ]; then
              echo "could not establish PyPI version state (HTTP $status)"
              exit 1
            fi
            gh release create "$TAG" release-files/* \
              --repo "$REPO" \
              --title "korvid $TAG" \
              --verify-tag \
              --generate-notes \
              --draft
          fi

  publish-pypi:
    needs: [verify, stage-github-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Protected environment: PyPI Trusted Publishing binds to this exact
    # workflow + environment; there is no API token anywhere.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      # The protected environment can pause this job. Re-fetch the remote tag
      # after approval and bind publication to the commit verified above:
      # `--verify-tag` alone only proves that a tag currently exists.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: Revalidate the remote tag immediately before PyPI publication
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: |
          git fetch --force origin \
            "+refs/tags/$TAG:refs/tags/$TAG" \
            "refs/heads/main:refs/remotes/origin/main"
          python scripts/release/check_source.py "$TAG" origin/main \
            --expected-commit "$EXPECTED_COMMIT"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          # Safe on rerun because stage-github-release first proves the
          # persisted draft assets are byte-identical to this run.
          skip-existing: true

  finalize-github-release:
    needs: [verify, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidate the remote tag immediately before release publication
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: |
          git fetch --force origin \
            "+refs/tags/$TAG:refs/tags/$TAG" \
            "refs/heads/main:refs/remotes/origin/main"
          python scripts/release/check_source.py "$TAG" origin/main \
            --expected-commit "$EXPECTED_COMMIT"
      - name: Publish the already-staged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$TAG" --repo "$REPO" \
            --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "staged release is missing or no longer a draft"
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
