name: K8s contract tests
# Live-cluster contract suite (issue #109). Runs the destructive
# write-path contract tests against the dedicated, stopped-at-rest
# AKS cluster `aks-korvid-contract-test`. Never runs for pull requests
# or forks: the Azure identity is scoped to the protected
# `aks-contract-test` environment, which only `main` may use.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korvid-k8s-contract
  cancel-in-progress: false

env:
  # The one cluster this workflow is allowed to touch. The guard steps
  # fail closed when the (mutable) environment variables drift from
  # these fixed, documented test-only names.
  EXPECTED_RESOURCE_GROUP: rg-korvid-contract-test
  EXPECTED_CLUSTER_NAME: aks-korvid-contract-test

jobs:
  contract:
    # GitHub-hosted ephemeral runner — deliberately NOT the shared
    # self-hosted `korvid-runners` pool, so cluster credentials never
    # touch persistent shared infrastructure.
    runs-on: ubuntu-latest
    environment: aks-contract-test
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      # Named only in the guard's repair hint. Fixed rather than a variable so
      # a drifting setting cannot send someone to scale the system pool.
      WORKLOAD_NODEPOOL: workload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard — refuse any target other than the documented test cluster
        run: |
          if [ "$AKS_RESOURCE_GROUP" != "$EXPECTED_RESOURCE_GROUP" ] || \
             [ "$AKS_CLUSTER_NAME" != "$EXPECTED_CLUSTER_NAME" ]; then
            echo "::error title=Cluster identity mismatch::environment variables point at $AKS_RESOURCE_GROUP/$AKS_CLUSTER_NAME, expected $EXPECTED_RESOURCE_GROUP/$EXPECTED_CLUSTER_NAME. Refusing to run destructive tests."
            exit 1
          fi

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Guard — verify test-only tags before touching the cluster
        run: |
          purpose=$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" \
            --query 'tags.purpose' -o tsv)
          production=$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" \
            --query 'tags."production-use"' -o tsv)
          if [ "$purpose" != "korvid-contract-testing" ] || [ "$production" != "prohibited" ]; then
            echo "::error title=Not a test-only cluster::$AKS_CLUSTER_NAME is missing the purpose=korvid-contract-testing / production-use=prohibited tags. Refusing to run destructive tests."
            exit 1
          fi

      - name: Start AKS cluster
        run: |
          # A preceding run's stop can still be finishing even though
          # powerState already reads Stopped; Azure rejects a start until it
          # settles. Not a barrier - failing here fails this job and cleanup
          # still runs - so give up early on a broken query rather than
          # burning ten minutes on it.
          WAIT_AKS_MAX_QUERY_FAILURES=3 \
            .github/scripts/wait-aks-settled.sh "$AKS_RESOURCE_GROUP" "$AKS_CLUSTER_NAME"
          state=$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --query powerState.code -o tsv)
          if [ "$state" != "Running" ]; then
            az aks start -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME"
          fi

      - uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: v0.2.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch user credentials (no --admin, isolated kubeconfig)
        run: |
          export KUBECONFIG="$RUNNER_TEMP/contract-kubeconfig"
          az aks get-credentials -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" \
            --overwrite-existing -f "$KUBECONFIG"
          kubelogin convert-kubeconfig -l azurecli --kubeconfig "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked --dev --all-extras

      - name: Install helm
        run: |
          HELM_VERSION=v3.19.0
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm

      - name: Janitor — remove stale fixtures from interrupted runs
        run: uv run python -m tests.contract.janitor

      - name: Guard — a schedulable disposable node must exist
        run: |
          set -euo pipefail
          # The suite needs one node that satisfies both of its requirements at
          # once: the node-operation contracts only touch
          # korvid.dev/disposable=true and fail closed rather than fall back to
          # a system node, while every test pod carries a
          # korvid.dev/pool=workload nodeSelector. Those labels riding the same
          # node is a convention of the pool setup, not something enforced
          # here, so both are required together — a node with only one of them
          # would let this guard pass and leave pods Pending.
          #
          # With no such node the suite produces six failures across four files
          # — "no disposable workload node found" and pod-scheduling timeouts —
          # none of which names the cause. It stayed red for eight commits.
          #
          # Asked of the cluster rather than of Azure: a stopped or
          # still-starting cluster reports agentPools[].count as 0 even when
          # the pool is populated, so the control-plane number is not evidence.
          #
          # Checked, not repaired: the workflow identity holds a deliberately
          # minimal role with agentPools/read and no write, and widening it so
          # this job could scale the pool would also let it reshape the system
          # pool that every other guard here exists to protect.
          SELECTOR=korvid.dev/disposable=true,korvid.dev/pool=workload

          # Prove the node list is reachable first. Otherwise an expired token,
          # an RBAC denial, or an unreachable API server spends the whole
          # deadline and then blames an empty pool, sending the reader after a
          # scale command that cannot help.
          if ! nodes=$(kubectl get nodes -o name 2>&1); then
            echo "::error title=Cannot query nodes::Listing nodes on $AKS_CLUSTER_NAME failed, so the disposable-node check could not run: $nodes"
            exit 1
          fi

          # `kubectl wait` requires *every* node matching the selector to
          # satisfy the condition, but this guard needs only one somewhere to
          # schedule. A second pool node, or one cycling through an image
          # upgrade, would otherwise burn the whole deadline and report "no
          # schedulable node" while a perfectly good one was sitting there.
          #
          # Ready alone is not enough: a crashed node-ops test leaves the node
          # cordoned, and a cordoned node would pass a Ready-only check and
          # leave every test pod Pending. This runs after the janitor, which
          # uncordons disposable nodes, so anything still cordoned here is
          # something the janitor could not fix and a human has to look at.
          deadline=$(( SECONDS + 300 ))
          while :; do
            if kubectl get nodes -l "$SELECTOR" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"=ready:"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{" unschedulable:"}{.spec.unschedulable}{"\n"}{end}' \
              2>/dev/null | grep -q '=ready:True unschedulable:$'; then
              kubectl get nodes -l "$SELECTOR"
              exit 0
            fi
            [ "$SECONDS" -lt "$deadline" ] || break
            sleep 5
          done
          echo "::error title=No schedulable disposable node::$AKS_CLUSTER_NAME has no Ready, uncordoned node matching $SELECTOR after 5 minutes, so the node-operation and resize contracts have nowhere to schedule. If a previous run left the node cordoned, uncordon it. If the $WORKLOAD_NODEPOOL pool is empty, restore it by starting the cluster first — this run's cleanup job stops it, and Azure rejects every operation except start on a stopped cluster: az aks start -g $AKS_RESOURCE_GROUP -n $AKS_CLUSTER_NAME && az aks nodepool scale -g $AKS_RESOURCE_GROUP --cluster-name $AKS_CLUSTER_NAME -n $WORKLOAD_NODEPOOL --node-count 1 && az aks stop -g $AKS_RESOURCE_GROUP -n $AKS_CLUSTER_NAME"
          kubectl get nodes -o wide --show-labels || true
          exit 1

      - name: Run contract suite
        timeout-minutes: 30
        env:
          KORVID_CONTRACT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run pytest -p no:randomly -m contract tests/contract/ -v

      - name: Collect diagnostics
        if: failure() || cancelled()
        run: |
          mkdir -p diag
          kubectl get events -A --sort-by=.lastTimestamp > diag/events.txt || true
          kubectl get pods -A -o wide > diag/pods.txt || true
          kubectl describe pods -A > diag/pods-describe.txt || true
          kubectl get nodes -o wide > diag/nodes.txt || true
          kubectl get ns -l app.kubernetes.io/managed-by=korvid-contract -o yaml > diag/namespaces.yaml || true

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-diagnostics
          path: diag/
          retention-days: 14

      - name: Delete kubeconfig
        if: always()
        run: |
          if [ -n "${KUBECONFIG:-}" ] && [ -f "$KUBECONFIG" ]; then
            rm -f "$KUBECONFIG"
          fi

  # Separate job so the stop runs even when the contract job hits its
  # timeout-minutes (GitHub kills the job before later always() steps,
  # which would leave the stopped-at-rest cluster running and billing).
  stop-cluster:
    needs: contract
    if: always()
    runs-on: ubuntu-latest
    environment: aks-contract-test
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
    steps:
      # The settle helper lives in the repo, so this job needs the tree too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard — refuse any target other than the documented test cluster
        run: |
          if [ "$AKS_RESOURCE_GROUP" != "$EXPECTED_RESOURCE_GROUP" ] || \
             [ "$AKS_CLUSTER_NAME" != "$EXPECTED_CLUSTER_NAME" ]; then
            echo "::error title=Cluster identity mismatch::environment variables point at $AKS_RESOURCE_GROUP/$AKS_CLUSTER_NAME, expected $EXPECTED_RESOURCE_GROUP/$EXPECTED_CLUSTER_NAME. Refusing to stop an unexpected cluster."
            exit 1
          fi

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stop AKS cluster
        run: |
          # A test may have left an operation in flight (a nodepool scale, a
          # failed run mid-write) and Azure would reject the stop outright.
          # Advisory only: it must never prevent the stop, because a step that
          # dies here leaves the cluster running with no recovery hint - so a
          # failed or timed-out wait falls through and lets the stop try
          # anyway, and its own error is the report.
          WAIT_AKS_TIMEOUT=300 WAIT_AKS_MAX_QUERY_FAILURES=3 \
          .github/scripts/wait-aks-settled.sh "$AKS_RESOURCE_GROUP" "$AKS_CLUSTER_NAME" \
          || echo "cluster did not settle before the stop; attempting it anyway"
          # Azure rejects a stop on a cluster that is not running, which is the
          # normal state when the contract job failed before starting it.
          state=$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --query powerState.code -o tsv 2>/dev/null || echo unknown)
          if [ "$state" = "Stopped" ]; then
          echo "$AKS_CLUSTER_NAME is already stopped"
          elif ! az aks stop -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --no-wait; then
          # The state read above can be `unknown` when the query itself
          # failed, so a rejection here may just mean it was already stopped.
          # Check before crying wolf: a red cleanup job for a cluster that is
          # costing nothing trains people to ignore this error.
          recheck=$(az aks show -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --query powerState.code -o tsv 2>/dev/null || echo unknown)
          if [ "$recheck" = "Stopped" ]; then
            echo "$AKS_CLUSTER_NAME was already stopped"
          else
            echo "::error title=AKS stop rejected::aks-korvid-contract-test would not accept a stop and reads $recheck; idle compute may be accruing. Stop it manually once its current operation finishes: az aks stop -g $AKS_RESOURCE_GROUP -n $AKS_CLUSTER_NAME"
            exit 1
          fi
          fi
          # powerState flips to Stopped as soon as Azure accepts the request,
          # while provisioningState stays Stopping until the operation really
          # finishes. Waiting on powerState alone let this job exit seconds
          # after asking, so the next merge's run hit "there's an in-progress
          # stop managed cluster operation" on its own start. This one is a
          # barrier, so it retries query failures through the whole budget.
          if ! WAIT_AKS_TIMEOUT=600 .github/scripts/wait-aks-settled.sh \
            "$AKS_RESOURCE_GROUP" "$AKS_CLUSTER_NAME" Stopped; then
          echo "::error title=AKS stop failed::aks-korvid-contract-test did not settle at Stopped; idle compute may be accruing. Stop it manually: az aks stop -g $AKS_RESOURCE_GROUP -n $AKS_CLUSTER_NAME"
          exit 1
          fi
