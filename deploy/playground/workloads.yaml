# Practice workloads for a throwaway cluster. See "Practice on a throwaway
# cluster" in docs/getting-started.md.
#
# Apply only to a disposable cluster, from a terminal whose kubeconfig holds
# nothing else:
#
#   export KUBECONFIG="$PWD/korvid-playground.kubeconfig"
#   kind create cluster --name korvid-playground
#   kubectl --context kind-korvid-playground apply -f workloads.yaml
#
# Everything lives in the `playground` namespace:
#
#   web       healthy: two nginx replicas behind a Service
#   checkout  CrashLoopBackOff: exits because DATABASE_URL is not set
#   payments  ImagePullBackOff: the image tag has a typo (`alpne`)
#
# Nothing here needs host access, privileges, or a Kubernetes API token.
# Remove it all with `kind delete cluster --name korvid-playground`.
---
apiVersion: v1
kind: Namespace
metadata:
  name: playground
  labels:
    app.kubernetes.io/part-of: korvid-playground
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: playground
  labels:
    app: web
    app.kubernetes.io/part-of: korvid-playground
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: korvid-playground
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: playground
  labels:
    app: web
    app.kubernetes.io/part-of: korvid-playground
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: playground
  labels:
    app: checkout
    app.kubernetes.io/part-of: korvid-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/part-of: korvid-playground
    spec:
      automountServiceAccountToken: false
      containers:
        - name: checkout
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "checkout: connecting to the orders database"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set" >&2
                exit 1
              fi
              echo "checkout: connected"
              while true; do sleep 3600; done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: playground
  labels:
    app: payments
    app.kubernetes.io/part-of: korvid-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        app.kubernetes.io/part-of: korvid-playground
    spec:
      automountServiceAccountToken: false
      containers:
        - name: payments
          image: nginx:1.27-alpne
